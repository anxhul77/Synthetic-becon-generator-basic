experiment_id: "exp19_fixed_vs_adaptive_eal"
title: "Fixed EAL vs Uncertainty-Adaptive EAL Search Strategy"
objective: "Quantitatively evaluate whether shaping Expanding Amplitude Lissajous (EAL) coarse search using predicted 5-second position covariance \\Sigma_5 achieves higher acquisition probability P_A, faster acquisition time T_A, and lower search path length L_search compared to fixed EAL."

simulation:
  fps: 30.0
  total_duration_sec: 15.0
  search_duration_sec: 5.0
  camera:
    width: 1920
    height: 1080
    fx: 2000.0
    fy: 2000.0

eal:
  freq_ratio: [3, 2]
  base_freq_hz: 0.5
  phase_shift_rad: 1.5707963267948966
  fixed_amplitude_px: 150.0
  gamma_coverage: 2.4477467707840478
  acq_radius_px: 15.0
  consec_frames_acq: 3

actuator_constraints:
  max_velocity_px_s: 1500.0
  max_accel_px_s2: 8000.0

motion_models:
  - name: "constant_velocity"
    vx_px_per_sec: 40.0
    vy_px_per_sec: 20.0
  - name: "sinusoidal"
    amp_x: 150.0
    amp_y: 100.0
    freq_x: 0.2
    freq_y: 0.2
  - name: "random_maneuver"
    max_accel: 30.0

num_trials_per_condition: 30
random_seed: 42
