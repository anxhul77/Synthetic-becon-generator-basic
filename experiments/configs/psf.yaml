experiment_name: psf
description: "Evaluates algorithm performance across isotropic and elliptical Gaussian PSF shapes."

camera:
  width: 1920
  height: 1080
  fx: 2000.0
  fy: 2000.0
  cx: 960.0
  cy: 540.0
  fps: 60.0

generator:
  amplitude: 150.0
  background_level: 10.0
  snr_db: 30.0
  range_km: 5.0
  attenuation_alpha: 0.0001
  atmospheric_condition: "clear"

sweep:
  psf_configurations:
    - psf_type: "gaussian"
      sigma_x: 1.5
      sigma_y: 1.5
    - psf_type: "gaussian"
      sigma_x: 2.0
      sigma_y: 2.0
    - psf_type: "gaussian"
      sigma_x: 3.5
      sigma_y: 3.5
    - psf_type: "elliptical"
      sigma_x: 1.5
      sigma_y: 3.0
    - psf_type: "elliptical"
      sigma_x: 3.0
      sigma_y: 1.5

trials_per_setting: 50
seed: 42
