experiment_name: noise_robustness
description: "Evaluates beacon localization robustness across varying signal-to-noise ratio (SNR) levels."

camera:
  width: 1920
  height: 1080
  fx: 2000.0
  fy: 2000.0
  cx: 960.0
  cy: 540.0
  fps: 60.0

generator:
  amplitude: 150.0
  background_level: 10.0
  sigma_x: 2.0
  sigma_y: 2.0
  psf_type: "gaussian"
  range_km: 5.0
  attenuation_alpha: 0.0001
  atmospheric_condition: "clear"

sweep:
  snr_db:
    - 40.0
    - 30.0
    - 25.0
    - 20.0
    - 15.0
    - 10.0
    - 7.0
    - 5.0
    - 3.0
    - 0.0

trials_per_snr: 100
seed: 12345
