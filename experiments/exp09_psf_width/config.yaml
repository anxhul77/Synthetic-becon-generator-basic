experiment:
  id: exp09_psf_width
  name: PSF Width and Localization Accuracy
  version: 1.0.0

camera:
  source: existing_generator_config
  width: 1920
  height: 1080
  fx: 2000.0
  fy: 2000.0
  cx: 960.0
  cy: 540.0

psf:
  model: gaussian
  isotropic: true
  sigma_values_px:
    - 0.5
    - 1.0
    - 1.5
    - 2.0
    - 2.5
    - 3.0
    - 4.0
  reference_sigma: 2.0

beacon:
  amplitude: 150.0
  subpixel_rendering: true

localization:
  methods:
    - weighted_centroid
    - gaussian_fit
    - psf_fit
  roi_size: 31
  roi_policy: ground_truth_centered
  use_ground_truth_as_estimator_input: false

noise:
  model: gaussian
  snr_values_db:
    - 30.0
    - 25.0
    - 20.0
    - 15.0
    - 10.0
    - 7.0
    - 5.0
    - 3.0
    - 0.0

background:
  primary_level: 10.0
  sensitivity_levels:
    - 0.0
    - 10.0
    - 50.0
    - 100.0
    - 200.0
    - 500.0
  gradient_scenarios:
    horizontal:
      b0: 10.0
      a: 0.05
      b: 0.0
    vertical:
      b0: 10.0
      a: 0.0
      b: 0.05
    twod:
      b0: 10.0
      a: 0.05
      b: 0.05

phase:
  steps:
    - 0.0
    - 0.125
    - 0.25
    - 0.375
    - 0.5
    - 0.625
    - 0.75
    - 0.875
  repetitions: 20

roi_sensitivity:
  roi_sizes:
    - 11
    - 15
    - 21
    - 31
    - 41

trials:
  primary_per_condition: 1000
  base_seed: 9009

statistics:
  confidence_level: 0.95
  bootstrap_iterations: 2000

execution:
  batch_size: 1
  resume_enabled: true
  save_raw_data: true
