experiment_id: "exp22_monte_carlo_validation"
title: "Monte Carlo Statistical Validation of Adaptive FSOC Search"
objective: "Scientifically validate algorithmic performance across randomized operational parameter distributions (SNR, PSF width, background, velocity, acceleration), evaluating in-distribution vs stress-testing regimes with statistical hypothesis testing and effect size reporting."

simulation:
  fps: 30.0
  total_duration_sec: 15.0
  search_duration_sec: 5.0
  camera:
    width: 1920
    height: 1080
    fx: 2000.0
    fy: 2000.0

monte_carlo:
  num_trials: 100
  random_seed: 42
  in_distribution_ratio: 0.7

parameter_distributions:
  snr_db:
    mean: 15.0
    std: 5.0
    min: 5.0
    max: 30.0
  psf_sigma:
    min: 1.0
    max: 3.5
  background_level:
    min: 5.0
    max: 50.0
  target_velocity_px_s:
    min: 10.0
    max: 80.0
  target_accel_px_s2:
    min: 0.0
    max: 40.0

eal:
  fixed_amplitude_px: 150.0
  gamma_coverage: 2.4477467707840478
  lambda_adapt: 12.5
  max_amplitude_px: 350.0
  acq_radius_px: 15.0
  consec_frames_acq: 3
