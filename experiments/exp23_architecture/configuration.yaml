experiment_id: exp23_architecture
title: "Experiment 23 — Sequential vs. Parallel Processing Architecture"
objective: "Empirically evaluate whether executing classical and AI beacon detection pipelines in parallel reduces per-frame processing latency and improves throughput compared with sequential execution."

primary_benchmark:
  num_frames: 1000
  resolution: [1920, 1080]
  fps_target: 60.0
  frame_budget_ms: 16.6667
  snr_db: 20.0
  background_level: 100.0
  detector_threshold: 160.0
  matching_radius_px: 5.0
  seed: 42
  num_repeats: 5

concurrency:
  mechanism: "ThreadPoolExecutor"  # ThreadPoolExecutor or ProcessPoolExecutor
  max_workers: 2

sensitivity_study:
  resolutions:
    - [640, 480]
    - [1280, 720]
    - [1920, 1080]
  snr_levels: [30.0, 20.0, 15.0, 10.0, 5.0]

model_checkpoint: "results/exp06_classical_vs_ai/models/exp06_beacon_ai_model.pt"
