background:
  levels:
  - 0.0
  - 10.0
  - 50.0
  - 100.0
  - 200.0
  - 500.0
  primary_level: 10.0
beacon:
  amplitude: 150.0
  subpixel_rendering: true
camera:
  cx: 960.0
  cy: 540.0
  fx: 2000.0
  fy: 2000.0
  height: 1080
  source: existing_generator_config
  width: 1920
execution:
  batch_size: 1
  resume_enabled: true
  save_raw_data: true
experiment:
  id: exp10_psf_mismatch
  name: PSF Mismatch and Localization Robustness
  version: 1.0.0
localization:
  gaussian_fit:
    model: isotropic_gaussian
  methods:
  - weighted_centroid
  - gaussian_fit
  - psf_aware_fit
  psf_aware_fit:
    estimate_beacon_center: true
    use_calibrated_psf: true
  roi_policy: ground_truth_centered
  roi_size: 31
noise:
  model: gaussian
  snr_db:
  - 30.0
  - 25.0
  - 20.0
  - 15.0
  - 10.0
  - 7.0
  - 5.0
  - 3.0
  - 0.0
psf:
  aberrated:
    aberration_types:
    - coma
    - astigmatism
    strength_waves:
    - 0.0
    - 0.05
    - 0.1
    - 0.2
  asymmetric:
    secondary_amplitude_ratios:
    - 0.0
    - 0.1
    - 0.2
    - 0.3
    secondary_offset_px: 1.0
  defocused:
    blur_sigma_px:
    - 0.0
    - 0.5
    - 1.0
    - 2.0
  elliptical:
    axis_ratios:
    - 1.0
    - 1.25
    - 1.5
    - 2.0
    orientations_deg:
    - 0
    - 45
  families:
  - gaussian
  - elliptical_gaussian
  - asymmetric
  - defocused
  - aberrated
  reference_family: gaussian
  reference_sigma_px: 2.0
statistics:
  bootstrap_iterations: 2000
  confidence_level: 0.95
trials:
  base_seed: 10010
  phase_repetitions: 20
  primary_per_condition: 1000
