experiment_id: "exp21_ablation_study"
title: "Ablation Study of FSOC Coarse Search Components"
objective: "Quantitatively isolate the contribution of prediction, uncertainty shaping, and error adaptation across Methods A (Fixed EAL), B (Predictive Fixed EAL), C (Uncertainty-Adaptive EAL), and D (Full Adaptive EAL)."

simulation:
  fps: 30.0
  total_duration_sec: 15.0
  search_duration_sec: 5.0
  camera:
    width: 1920
    height: 1080
    fx: 2000.0
    fy: 2000.0

ablation_methods:
  - id: "A"
    name: "Method A — Fixed EAL"
    prediction: false
    uncertainty_search: false
    error_adaptation: false
  - id: "B"
    name: "Method B — Predictive Fixed EAL"
    prediction: true
    uncertainty_search: false
    error_adaptation: false
  - id: "C"
    name: "Method C — Uncertainty-Adaptive EAL"
    prediction: true
    uncertainty_search: true
    error_adaptation: false
  - id: "D"
    name: "Method D — Full Adaptive EAL"
    prediction: true
    uncertainty_search: true
    error_adaptation: true

eal:
  fixed_amplitude_px: 150.0
  gamma_coverage: 2.4477467707840478
  lambda_adapt: 12.5
  max_amplitude_px: 350.0
  acq_radius_px: 15.0
  consec_frames_acq: 3

motion_models:
  - name: "constant_velocity"
    vx_px_per_sec: 40.0
    vy_px_per_sec: 20.0
  - name: "sinusoidal"
    amp_x: 150.0
    amp_y: 100.0
    freq_x: 0.2
    freq_y: 0.2
  - name: "random_maneuver"
    max_accel: 30.0

num_trials_per_condition: 30
random_seed: 42
