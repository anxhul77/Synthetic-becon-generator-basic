ablation_methods:
- error_adaptation: false
  id: A
  name: "Method A \xE2\u20AC\u201D Fixed EAL"
  prediction: false
  uncertainty_search: false
- error_adaptation: false
  id: B
  name: "Method B \xE2\u20AC\u201D Predictive Fixed EAL"
  prediction: true
  uncertainty_search: false
- error_adaptation: false
  id: C
  name: "Method C \xE2\u20AC\u201D Uncertainty-Adaptive EAL"
  prediction: true
  uncertainty_search: true
- error_adaptation: true
  id: D
  name: "Method D \xE2\u20AC\u201D Full Adaptive EAL"
  prediction: true
  uncertainty_search: true
eal:
  acq_radius_px: 15.0
  consec_frames_acq: 3
  fixed_amplitude_px: 150.0
  gamma_coverage: 2.4477467707840477
  lambda_adapt: 12.5
  max_amplitude_px: 350.0
experiment_id: exp21_ablation_study
motion_models:
- name: constant_velocity
  vx_px_per_sec: 40.0
  vy_px_per_sec: 20.0
- amp_x: 150.0
  amp_y: 100.0
  freq_x: 0.2
  freq_y: 0.2
